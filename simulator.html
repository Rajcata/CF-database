<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CF simulator</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1c1d21; --muted:#6a6d76; --line:#dcdad3;
  --accent:#b3401f; --accent-ink:#ffffff; --row:#f1efe9; --sticker:#8a8c91; --centre:#6f7176;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17181b; --panel:#202226; --ink:#eceae4; --muted:#9a9da6; --line:#34363c;
    --accent:#f08a5d; --accent-ink:#17181b; --row:#26282d; --sticker:#74767c; --centre:#55575d; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
header{padding:18px 20px 6px;max-width:1180px;margin:0 auto}
h1{font-size:20px;margin:0;letter-spacing:.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
nav a{padding:5px 12px;border:1px solid var(--line);border-radius:7px;text-decoration:none;color:var(--ink);font-size:14px}
nav a[aria-current=page]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{max-width:760px;margin:0 auto;padding:10px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
header{max-width:760px}
@media (max-width:820px){main{padding:10px 16px 32px}header{padding:16px 16px 4px}}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:7px;cursor:pointer;padding:5px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed=true],button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scramble{font:600 clamp(20px,3.2vw,30px)/1.3 var(--mono);word-spacing:.25em;text-align:center;margin:6px 0 12px;min-height:40px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1 1 220px;min-width:0;font:15px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.err{color:var(--accent);font-size:13px;margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:13px;padding:4px 10px}
.sol h3{margin:0 0 8px;font-size:15px}
.sol h3 small{font-weight:400;color:var(--muted);margin-left:8px;font-size:13px}
.part{font:600 clamp(16px,2.2vw,20px)/1.5 var(--mono);word-spacing:.15em;overflow-wrap:anywhere}
.part b{color:var(--accent);margin-right:.5em}
.part .note{font:400 13px system-ui,sans-serif;color:var(--muted);word-spacing:normal}
.part.final{margin-top:4px}
.msg{color:var(--muted);padding:6px 0}
.var + .var{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:4px}
.meta{font-size:13px;color:var(--muted);margin-top:5px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>CF simulator</h1>
  <nav><a href="index.html">Database</a><a href="trainer.html">Trainer</a><a href="simulator.html" aria-current="page">Simulator</a></nav>
</header>
<main>
  <section class="panel">
    <div class="scramble" id="scramble"></div>
    <div class="row">
      <button class="primary" id="new">New scramble</button>
      <input id="typed" type="text" placeholder="or type a scramble" aria-label="Scramble in U L R B" autocomplete="off" spellcheck="false">
      <button id="use">Simulate</button>
    </div>
    <p class="err" id="err" hidden></p>
    <div class="row" style="margin-top:12px"><span class="label">Algorithms</span><div class="chips" id="pool"></div></div>
    <div class="row" style="margin-top:8px"><span class="label">11-move algorithms</span><div class="chips" id="eleven"></div></div>
    <div class="row" style="margin-top:8px"><span class="label">ABL</span><div class="chips" id="abl"></div></div>
  </section>
  <div id="solutions" style="display:grid;gap:14px;grid-template-columns:minmax(0,1fr)"></div>
</main>
<div id="toast" role="status"></div>
<script src="trainer_data.js?v=5"></script>
<script src="trainer_core.js?v=5"></script>
<script src="sim_data.js?v=5"></script>
<script src="sim_core.js?v=5"></script>
<script>
"use strict";
const DIGIT = ["0","+","−"];
const POOLS = [[1,"Top algorithm"],[10,"Top 10"],[Infinity,"All"]];
const $ = id => document.getElementById(id);

let limit = 10, no11 = false, abl = false, current = null, prep = null, runId = 0;
try { const v = localStorage.getItem("cf-sim-pool"); if (v === "1") limit = 1; else if (v === "all") limit = Infinity; no11 = localStorage.getItem("cf-sim-no11") === "1"; abl = localStorage.getItem("cf-sim-abl") === "1"; } catch (e) {}

const cache = {}, waiting = {};
window.CF_DATA = function(letter, n, text){
  cache[letter + n] = text ? text.split("\n").map(line => { const p = line.split("\t"); return {score:p[0], moves:+p[1], angle:p[2], alg:p[3]}; }) : [];
  (waiting[letter + n] || []).forEach(f => f(true)); delete waiting[letter + n];
};
function load(letter, n){
  const k = letter + n;
  if (cache[k]) return Promise.resolve(true);
  return new Promise(done => {
    if (waiting[k]) return waiting[k].push(done);
    waiting[k] = [done];
    const s = document.createElement("script");
    s.src = "data/" + letter + "/" + n + ".js";
    s.onerror = () => { (waiting[k] || []).forEach(f => f(false)); delete waiting[k]; };
    document.head.append(s);
  });
}

function caseName(n){ const o = []; for (let i = 5; i >= 0; i--){ o[i] = n % 3; n = Math.floor(n / 3); }
  return "("+DIGIT[o[0]]+DIGIT[o[1]]+") ("+DIGIT[o[2]]+DIGIT[o[3]]+") ("+DIGIT[o[4]]+DIGIT[o[5]]+")"; }
function caseHash(l, n){ return "#" + l + n.toString(3).padStart(6, "0"); }
function copy(text){
  const ok = () => { const t = $("toast"); t.textContent = "Copied: " + text; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"), 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, () => {});
}
function add(parent, tag, text, cls){ const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; parent.append(e); return e; }

function renderPool(){
  const box = $("pool"); box.textContent = "";
  for (const [val, text] of POOLS){
    const b = add(box, "button", text);
    b.setAttribute("aria-pressed", limit === val);
    b.onclick = () => { limit = val; try { localStorage.setItem("cf-sim-pool", val === Infinity ? "all" : String(val)); } catch (e) {} renderPool(); renderSolutions(); };
  }
}
function renderEleven(){
  const box = $("eleven"); box.textContent = "";
  for (const [val, text] of [[false, "Used"], [true, "Not used"]]){
    const b = add(box, "button", text);
    b.setAttribute("aria-pressed", no11 === val);
    b.onclick = () => { no11 = val; try { localStorage.setItem("cf-sim-no11", val ? "1" : "0"); } catch (e) {} renderEleven(); renderSolutions(); };
  }
}
function renderAbl(){
  const box = $("abl"); box.textContent = "";
  for (const [val, text] of [[false, "Off"], [true, "On"]]){
    const b = add(box, "button", text);
    b.setAttribute("aria-pressed", abl === val);
    b.onclick = () => { abl = val; try { localStorage.setItem("cf-sim-abl", val ? "1" : "0"); } catch (e) {} renderAbl(); renderSolutions(); };
  }
}
// the case's list as the pool sees it: with 11-move algorithms left out if switched off
function column(v){ const c = cache[v.letter + v.n] || []; return no11 ? c.filter(e => e.moves <= 10) : c; }
// name of a variant: where the algorithm sits among the layer moves
function kind(v){
  if (v.split === v.size) return "Layer, alg";
  if (v.split === 0) return "ABL";
  const m = k => k + (k === 1 ? " move" : " moves");
  return m(v.split) + ", alg, " + m(v.size - v.split);
}
// how many moves at the end of `left` and at the start of `right` merge or cancel
function meeting(left, right){
  let n = 0;
  while (n < left.length && n < right.length){
    const x = left[left.length - 1 - n], y = right[n];
    if (x[0] !== y[0]) break;
    n++;
    if ((x.length + y.length) % 3 !== 0) break;     // merged into one move: nothing further can cancel
  }
  return n;
}
// the solution in execution order: layer part(s) and algorithm, each on its own line with
// what it is; moves that merge or cancel where two parts meet are bracketed, and the
// merged string is given as "final"
function renderParts(blk, sol, layerLabel){
  const toks = t => t ? t.split(" ") : [];
  const parts = [];
  if (sol.before) parts.push({moves: toks(sol.before), layer: true});
  if (sol.entry) parts.push({moves: toks(sol.entry.alg), layer: false});
  if (sol.tail) parts.push({moves: toks(sol.tail), layer: true});
  const open = parts.map(() => 0), close = parts.map(() => 0);
  let clash = false;
  for (let i = 0; i + 1 < parts.length; i++){
    const n = meeting(parts[i].moves, parts[i + 1].moves);
    open[i] = n; close[i + 1] = n;
  }
  parts.forEach((p, i) => { if (open[i] + close[i] > p.moves.length) clash = true; });
  parts.forEach((p, i) => {
    const line = add(blk, "div", undefined, "part");
    if (i === 0) add(line, "b", String(sol.angle));
    const m = p.moves.slice();
    if (!clash){
      if (close[i]) m[close[i] - 1] += ")";
      if (open[i]) m[m.length - open[i]] = "(" + m[m.length - open[i]];
    }
    add(line, "span", m.join(" "), "mv");
    const note = add(line, "span", " / ", "note");
    if (p.layer) note.append(layerLabel);
    else { const a = add(note, "a", sol.letter + " " + caseName(sol.n)); a.href = "index.html" + caseHash(sol.letter, sol.n); a.target = "_blank"; a.rel = "noopener"; }
  });
  if (!parts.length) add(blk, "div", "solved", "part");
  if (sol.cancelled){
    const fin = add(blk, "div", undefined, "part final");
    add(fin, "span", "final: ", "note"); add(fin, "span", sol.text, "mv");
  }
  add(blk, "div", sol.moves + (sol.moves === 1 ? " move" : " moves"), "meta");
  blk.title = "Click to copy"; blk.style.cursor = "copy";
  blk.onclick = e => { if (e.target.tagName !== "A") copy(sol.angle + " " + sol.text); };
}
async function renderSolutions(){
  const box = $("solutions"), id = ++runId;
  if (!prep){ box.textContent = ""; return; }
  // which variants are shown (same list for every choice of an option)
  const count = o => abl ? o.choices[0].variants.length : 1;
  const need = [];
  prep.options.forEach(o => o.choices.forEach(c => c.variants.slice(0, count(o)).forEach(v => { if (!v.done) need.push(load(v.letter, v.n)); })));
  const ok = (await Promise.all(need)).every(x => x);
  if (id !== runId) return;
  box.textContent = "";
  prep.options.forEach((o, i) => {
    const card = add(box, "section", undefined, "panel sol"), first = o.choices[0];
    add(card, "h3", "Solution " + (i + 1));
    if (!ok){ add(card, "div", "Could not load the database lists for this scramble.", "msg"); return; }
    for (let k = 0; k < count(o); k++){
      const v0 = first.variants[k], blk = add(card, "div", undefined, "var");
      if (abl && first.layer) add(blk, "div", kind(v0), "kind");
      const sol = CFS.finishOption(o, k, column, limit);
      if (!sol){ add(blk, "div", "No algorithm in this pool fits" + (no11 ? " without 11-move algorithms." : "."), "msg"); continue; }
      renderParts(blk, sol, "layer " + sol.layer);
    }
  });
}
function show(scr){
  current = scr; $("err").hidden = true;
  $("scramble").textContent = scr.text;
  try { prep = CFS.prepare(scr.state); }
  catch (e){ prep = null; $("err").hidden = false; $("err").textContent = "This scramble could not be simulated: " + e.message; }
  renderSolutions();
}
$("new").onclick = () => { $("typed").value = ""; show(CFS.randomScramble()); };
function useTyped(){
  const scr = CFS.parseScramble($("typed").value);
  if (!scr){ $("err").hidden = false; $("err").textContent = "A scramble may only contain U, L, R, B, each optionally followed by ' (for example: U L' R B')."; return; }
  show(scr);
}
$("use").onclick = useTyped;
$("typed").addEventListener("keydown", e => { if (e.key === "Enter") useTyped(); });
renderPool(); renderEleven(); renderAbl();
show(CFS.randomScramble());
</script>
</body>
</html>
